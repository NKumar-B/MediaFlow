<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediaFlow</title>

    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#090d16" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediaFlow" />

    <link rel="manifest" href="manifest.json" />
    <script>
      // Auto-recover from stale Service Worker / cached asset bundle MIME mismatch errors
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[MediaFlow] Asset load failure detected. Purging SW caches and reloading...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var reg of registrations) { reg.unregister(); }
            });
          }
          if (window.caches) {
            caches.keys().then(function (names) {
              for (var name of names) { caches.delete(name); }
            });
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
